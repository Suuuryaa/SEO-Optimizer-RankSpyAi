name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Monday 6am UTC

jobs:
  python-audit:
    name: Python CVE Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          pip-audit -r backend/requirements.txt \
            --format=json \
            --output=pip-audit-report.json \
            --strict
        continue-on-error: true

      - name: Show pip-audit results
        run: |
          python3 -c "
          import json, sys
          try:
              data = json.load(open('pip-audit-report.json'))
              vulns = data.get('vulnerabilities', [])
              if not vulns:
                  print('No vulnerabilities found.')
                  sys.exit(0)
              for v in vulns:
                  print(f\"VULN: {v['name']} {v['version']} — {', '.join(a['id'] for a in v.get('aliases',[]))}\")
              high = [v for v in vulns if any('CRITICAL' in str(a) or 'HIGH' in str(a) for a in v.get('aliases', []))]
              if high:
                  print(f'{len(high)} HIGH/CRITICAL vulnerabilities found — failing build')
                  sys.exit(1)
          except Exception as e:
              print(f'Could not parse report: {e}')
          "

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-${{ github.run_number }}
          path: pip-audit-report.json

  npm-audit:
    name: npm CVE Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Audit npm dependencies
        run: |
          cd frontend
          npm audit --json > npm-audit-report.json 2>&1 || true
          npm audit --audit-level=high
        continue-on-error: true

      - name: Upload npm-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-${{ github.run_number }}
          path: frontend/npm-audit-report.json

  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

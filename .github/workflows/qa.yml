name: Nightly QA — RankSpy AI

on:
  schedule:
    - cron: '0 2 * * *'    # 2am UTC daily
  push:
    branches: [main]
  workflow_dispatch:        # allow manual trigger

jobs:
  qa:
    name: Playwright QA Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright + deps
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Copy QA script
        run: cp /tmp/rankspy-qa/test.js qa_test.js 2>/dev/null || echo "using inline test"

      - name: Run full QA suite
        id: qa
        run: node qa_test.js
        env:
          BASE_URL: https://rankspyseo.xyz
        continue-on-error: true

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://rankspyseo.xyz
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

  backend-health:
    name: Backend Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Check /health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://funlab-seo-dashboard-production.up.railway.app/health)
          echo "Backend status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Backend returned HTTP $STATUS"
          fi

      - name: Check /rate-status endpoint
        run: |
          curl -s https://funlab-seo-dashboard-production.up.railway.app/rate-status | python3 -m json.tool

      - name: Smoke test /analyze
        run: |
          RESP=$(curl -s -X POST https://funlab-seo-dashboard-production.up.railway.app/analyze \
            -H "Content-Type: application/json" \
            -d '{"url":"https://example.com","keyword":"test"}' \
            --max-time 90)
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Score: {d[\"seo_score\"]} | Semantic: {d.get(\"semantic\",{}).get(\"semantic_score\",\"N/A\")}')" || echo "Parse failed: $RESP"

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Take screenshots
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.setViewportSize({ width: 1280, height: 900 });
            await page.goto('https://rankspyseo.xyz', { waitUntil: 'networkidle' });
            await page.screenshot({ path: 'screenshot-desktop.png', fullPage: true });
            await page.setViewportSize({ width: 390, height: 844 });
            await page.screenshot({ path: 'screenshot-mobile.png', fullPage: true });
            await browser.close();
            console.log('Screenshots saved');
          })();
          "

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshot-*.png

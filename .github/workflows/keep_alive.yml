name: Keep Live Site Warm

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 mins
  workflow_dispatch:      # manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          curl -s -o /dev/null -w "frontend %{http_code}\n" https://rankspyseo.xyz/
          curl -s -o /dev/null -w "backend %{http_code}\n" https://affectionate-recreation-production-e508.up.railway.app/health
